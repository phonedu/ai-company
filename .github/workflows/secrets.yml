# 密钥熵扫描（含提交历史，2026-11-10）。
# 口径：与 scripts/check-privacy.mjs（规则型）互补——这里抓「看起来像密钥的随机串」。
# 若有历史误报，落 .gitleaks.toml allowlist（按文件豁免，不按目录大放行）。
name: Secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 扫全历史（防「曾经提交过、后来删了」）
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
