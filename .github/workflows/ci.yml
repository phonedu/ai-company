name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发（2026-11-10）：清理历史/分支后需要一条 main 的全量回归，而不必为触发空提交。
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 隐私闸门要扫提交历史
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0 # 与本地验证一致；better-sqlite3 有该版本预编译
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # B0-10：生产依赖漏洞门（high/critical 阻断；overrides 已把 undici/katex/minimatch 升到修复版）
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test
      - run: pnpm build
