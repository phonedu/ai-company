name: Feature request
description: 提出一个想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 先描述场景，不要只给方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望怎么做
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
