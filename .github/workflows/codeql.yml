# CodeQL 静态安全分析（2026-11-10）：security-extended + SARIF。
# 为什么不用「一次扫描给结论」：通用扫描器对动态派发密集的工程只能给出「不确定」；
# CodeQL 对 JS/TS 不需要构建，结果以 SARIF 进 Security 页，可逐条复核。
# 口径：这是**告警源**，不是「已安全」声明；每条告警按真实数据流人工消解。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 20:00 UTC（周二 04:00 本地）补一次全量基线
    - cron: '0 20 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # JS/TS 不需要编译步骤：直接用源码建库（避免在 CI 里跑 better-sqlite3 原生构建）。
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
